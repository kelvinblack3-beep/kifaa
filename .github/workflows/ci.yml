name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use packageManager from root package.json (pnpm@9.15.0).
      # Do not set version here — pnpm/action-setup@v4 errors on mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No pnpm-lock.yaml in repo yet; skip cache until lockfile is committed.

      - name: Install
        run: pnpm install

      # Build shared first so dependents can resolve workspace types/main.
      - name: Build shared
        run: pnpm --filter @kifaa/shared build

      # Typecheck packages that are currently valid.
      # @kifaa/ledger typecheck is intentionally not run yet: src/postgres.ts is still PLACEHOLDER
      # and exports are incomplete. That is a product/code issue, not a CI config issue.
      - name: Typecheck (shared, database)
        run: pnpm --filter @kifaa/shared --filter @kifaa/database typecheck

      - name: Ledger unit tests
        run: pnpm --filter @kifaa/ledger test

      - name: Web tests
        run: pnpm --filter @kifaa/web test

      - name: Build ledger
        run: pnpm --filter @kifaa/ledger build

      - name: Web build
        run: pnpm --filter @kifaa/web build
