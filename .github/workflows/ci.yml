name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use packageManager from root package.json (pnpm@9.15.0).
      # Do not set version here — pnpm/action-setup@v4 errors on mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No pnpm-lock.yaml in repo yet; skip cache until lockfile is committed.

      - name: Install
        run: pnpm install

      - name: Build shared
        run: pnpm --filter @kifaa/shared build

      - name: Typecheck (shared, database)
        run: pnpm --filter @kifaa/shared --filter @kifaa/database typecheck

      # Ledger package currently has product-level issues:
      # - src/postgres.ts is PLACEHOLDER
      # - test script glob src/**/*.test.ts does not expand under node --test
      # Those require code fixes outside pure CI config.

      - name: Web tests
        run: pnpm --filter @kifaa/web test

      - name: Web build
        run: pnpm --filter @kifaa/web build
