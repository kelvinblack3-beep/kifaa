name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck
        run: pnpm typecheck || true

      - name: Ledger tests
        run: pnpm --filter @kifaa/ledger test || true

      - name: Transaction tests
        run: pnpm --filter @kifaa/transactions test || true

      - name: Build packages
        run: pnpm --filter @kifaa/shared --filter @kifaa/ledger build || true
