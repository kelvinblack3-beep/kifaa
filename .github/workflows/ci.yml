name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use packageManager from root package.json (pnpm@9.15.0).
      # Do not set version here — pnpm/action-setup@v4 errors on mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No pnpm-lock.yaml in repo yet; skip cache until lockfile is committed.

      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Ledger tests
        run: pnpm --filter @kifaa/ledger test

      - name: Web tests
        run: pnpm --filter @kifaa/web test

      - name: Build packages
        run: pnpm --filter @kifaa/shared --filter @kifaa/ledger build

      - name: Web build
        run: pnpm --filter @kifaa/web build
